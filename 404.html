<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>麻経 AZAKEI は引っ越しました</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://azakeiten.github.io/" />
  <script>
    // 古い URL（/azakei/◯◯）を、新しい URL の同じページへ
    (function () {
      var path = location.pathname.replace(/^\/azakei\/?/, '');
      location.replace('https://azakeiten.github.io/' + path + location.search + location.hash);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=https://azakeiten.github.io/" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f3ef; color: #17191e; font-family: system-ui, sans-serif; text-align: center; }
    a { color: #7a5a26; }
  </style>
</head>
<body>
  <p>麻経 AZAKEI のホームページは、<br><a href="https://azakeiten.github.io/">https://azakeiten.github.io/</a> に引っ越しました。</p>
</body>
</html>
